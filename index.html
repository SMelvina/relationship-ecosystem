<!DOCTYPE html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F1EBE5;--s:#FFE6F1;--pk:#FFB8D6;--pk2:#FF5CA5;--pu:#E0207F;--pu2:#FFD9EA;--ink:#1E1236;--mu:#5A4E75;--ln:#F5CFE2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.bar{max-width:1440px;width:92%;margin:0 auto;padding:18px 0;display:flex;align-items:center;gap:12px}
.mast{margin-right:auto;background:none;border:0;padding:0;font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.nv{background:none;border:0;padding:10px 18px;color:var(--mu);font-weight:600;font-size:.95rem;border-radius:999px;transition:.2s}.nv:hover{color:var(--pu)}.nv[aria-current="true"]{color:var(--pu);background:none}
.btn{background:#E0207F;color:#fff;border:0;border-radius:999px;padding:14px 30px;font-size:1.02rem;font-weight:600;transition:.2s}.btn:hover{filter:brightness(.92);transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn.alt{background:#FFB8D6;color:var(--ink)}.btn.alt:hover{background:#FF5CA5}.btn.out{background:none;color:#E0207F;box-shadow:inset 0 0 0 2px #E0207F}.btn.out:hover{background:none;filter:none;color:#C4136B;box-shadow:inset 0 0 0 2px #C4136B}

.wrap{max-width:1440px;width:92%;margin:0 auto;padding:64px 0 140px}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:38px}
.hero .btn{white-space:nowrap;padding:14px 28px}@media(min-width:1001px){.hero .row{flex-wrap:nowrap}}
.sub{color:var(--mu);max-width:28em;margin:20px 0 0;font-size:1.18rem;line-height:1.6}
.hero h1{font-size:clamp(2.4rem, 6.2vw, 5.8rem);max-width:12em;line-height:.96;font-weight:800}.hero h1 span{color:var(--pu)}
.lv{display:flex;flex-wrap:wrap;gap:12px;margin-top:72px}
.lv button{background:var(--s);border:0;border-radius:999px;padding:12px 22px;font-size:.98rem;font-weight:600;color:var(--ink);transition:.2s}.lv button:hover{background:var(--pk);transform:translateY(-1px)}
.stp{display:flex;gap:8px;margin-bottom:24px}.stp button{flex:1;border:0;background:none;padding:0;text-align:left;color:var(--mu);font-size:.9rem}
.stp button i{display:block;height:6px;border-radius:3px;background:var(--ln);margin-bottom:10px;transition:.2s}.stp button[aria-current="true"]{color:var(--ink);font-weight:700}.stp button:hover i{filter:brightness(.92)}
.k{color:var(--pu);font-weight:700;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
.ch h2{font-size:clamp(2.5rem,5.5vw,4.2rem);font-weight:800}.stand{font-size:1.5rem;color:var(--mu);margin:16px 0 0;max-width:32em;line-height:1.45}.lead{max-width:42em;font-size:1.18rem;margin:26px 0 68px}
.ch-hero{display:grid;grid-template-columns:1.15fr 0.85fr;gap:48px;align-items:center;margin-bottom:48px}
.ch-intro .stand{margin:14px 0 0;max-width:32em}
.ch-intro .lead{margin:20px 0 0;max-width:36em}

@media(max-width:860px){.ch-hero{grid-template-columns:1fr;gap:28px}.ch-hero .ill{order:-1;justify-self:start;max-width:440px}}
.feat{display:grid;grid-template-columns:260px 1fr;gap:48px;padding:44px 0;border-top:1.5px solid var(--ln)}
.feat h3{font-size:1.6rem;font-weight:700}.fn{color:var(--pu);font-weight:600;margin-top:6px;font-size:1.02rem}
.q1{font-size:1.45rem;line-height:1.48;margin:0 0 16px;max-width:34em;font-weight:500}.why{color:var(--mu);margin:0;max-width:40em;font-size:1.05rem}.why b{color:var(--ink);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:14px;margin-top:54px;flex-wrap:wrap}
.card{background:#E8DAD2;border-radius:24px;padding:40px}
.grid{display:grid;grid-template-columns:1.35fr .85fr;gap:36px;align-items:start}
.mapc{background:var(--bg);border:1.5px solid var(--ln);border-radius:24px;padding:18px}
svg text{font-family:"DM Sans",sans-serif}.nd{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .24s cubic-bezier(.25,1,.5,1)}.nd:hover{transform:scale(1.12)}.nd:active{transform:scale(.96)}.nd:focus-visible{outline:none}.nd:focus-visible circle{stroke:var(--ink);stroke-width:3}.nd circle{transition:r .24s cubic-bezier(.25,1,.5,1),stroke-width .24s ease,stroke .24s ease}#pn{transition:opacity .14s ease,transform .14s ease}
.leg{display:flex;flex-wrap:wrap;gap:10px 24px;font-size:.9rem;color:var(--mu);margin:20px 4px 0}.leg i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:7px;border:1.5px solid var(--pk2)}
.av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.4rem;margin-bottom:18px}
.tag{display:inline-block;background:var(--pu2);color:var(--pu);font-size:.88rem;font-weight:700;padding:4px 14px;border-radius:999px;margin-top:12px}
.pb h3{font-size:2rem;font-weight:800}.pb dl{margin:28px 0 0;display:grid;gap:18px}.pb dt{color:var(--mu);font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}.pb dd{margin:4px 0 0;font-weight:500;font-size:1.02rem}
.rc{display:inline-block;background:#fff;border:1.5px solid var(--ln);border-radius:999px;padding:4px 14px;font-size:.9rem;margin:0 8px 8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.chip{border:1.5px solid var(--ln);background:#fff;border-radius:999px;padding:6px 16px;font-size:.9rem;font-weight:500;transition:.2s}.chip:hover{border-color:var(--pk2);color:var(--pu)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:34px 0}
.opt{text-align:left;background:#fff;border:1.5px solid var(--ln);border-radius:16px;padding:16px 18px;transition:.2s}.opt:hover{border-color:var(--pk2)}.opt b{display:block;font-size:1.02rem}.opt span{display:block;color:var(--mu);font-size:.84rem;line-height:1.42;margin-top:4px}
.opt[aria-pressed="true"],.sel[aria-pressed="true"]{border-color:var(--pu);background:var(--pu2)}
label{display:block;font-weight:700;font-size:1.08rem;margin:34px 0 12px}label small{font-weight:400;color:var(--mu);font-size:.9rem}
input[type=text]{width:100%;background:#fff;border:1.5px solid var(--ln);border-radius:16px;padding:16px 18px;font-size:1.05rem;transition:.2s}input[type=text]:focus{border-color:var(--pu);outline:none;box-shadow:0 0 0 3px var(--pu2)}
.sel{border:1.5px solid var(--ln);background:#fff;border-radius:999px;padding:8px 18px;font-size:.94rem;font-weight:500;transition:.2s}.sel:hover{border-color:var(--pk2)}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 44px}.dt{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ln);background:#fff;font-size:.82rem;font-weight:700;color:var(--mu);padding:0;transition:.15s}.dt:hover{border-color:var(--pu)}.dt.ok{background:var(--pu);border-color:var(--pu);color:#fff}.dt.cur{box-shadow:0 0 0 4px var(--pk)}
.msg{color:var(--pu);font-size:.92rem;min-height:1.4em;margin-top:14px;font-weight:600}
.scroll{overflow-x:auto;border:1.5px solid var(--ln);border-radius:20px;margin:24px 0}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:1rem}th,td{padding:16px 20px;text-align:left;border-bottom:1.5px solid var(--ln)}tr:last-child td{border:0}th{color:var(--mu);font-weight:600;font-size:.88rem;background:#E8DAD2}
tbody tr[data-p]{cursor:pointer;transition:.2s}tbody tr[data-p]:hover{background:#E8DAD2}tr.on td{background:var(--pu2)}td.x{text-align:center;color:var(--pu);font-weight:700;font-size:1.15rem}th.c{text-align:center}
.dd{position:relative;margin-top:0}.dd>.sel{display:flex;width:100%;justify-content:space-between;gap:12px;padding:14px 20px;border-radius:16px;font-weight:600;font-size:1rem}.dm{position:absolute;left:0;right:0;top:calc(100% + 8px);max-height:360px;overflow:auto;background:#fff;border:1.5px solid var(--ln);border-radius:18px;padding:10px;box-shadow:0 22px 38px -18px rgba(30,18,54,.3);z-index:6}.dm[hidden]{display:none}.dm h4{margin:12px 12px 6px;font-size:.78rem;color:#E0207F;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.mi{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;margin-bottom:3px;border-radius:12px;font-size:.95rem;transition:.15s}.mi:hover,.mi[aria-current="true"]{background:var(--pu2)}
.sec{margin-top:90px}.sec h3{font-size:1.85rem;font-weight:700;margin-bottom:28px}
.ph{display:grid;grid-template-columns:160px 1fr 38px;gap:16px;align-items:center;margin:16px 0;font-size:1rem}.ph .t{height:10px;background:var(--pu2);border-radius:5px;overflow:hidden}.ph .t i{display:block;height:100%;background:var(--pu);border-radius:5px}
ul.n{padding-left:24px;margin:0}ul.n li{margin:14px 0;font-size:1.02rem}
.link{background:none;border:0;padding:0;color:var(--pu);text-decoration:underline;font-weight:500}
body{overflow-x:hidden}.band{background:#FAF7F3;margin:120px calc(50% - 50vw) -140px;padding:80px 0 130px}.band-in{max-width:1440px;width:100%;padding:0 32px;margin:0 auto;display:flex;flex-direction:column;align-items:center}.fan-t{text-align:center;font-size:clamp(2.6rem,4.8vw,4.2rem);font-weight:800;letter-spacing:-.02em;margin:0 0 24px}.ft{border-top:1.5px solid #E2D7CE;background:var(--bg)}.fi{max-width:1440px;width:92%;margin:0 auto;padding:48px 0 calc(48px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:24px 40px;align-items:start}.ft p{margin:0;color:var(--mu);font-size:1rem;line-height:1.65}.ft .a{max-width:28em;color:var(--ink);font-size:1.02rem;font-weight:500}.ft img{height:44px;width:auto;display:block;margin:0;grid-column:1/-1}.ft .l{text-align:left}.ft .r{text-align:right;justify-self:end}@media(max-width:760px){.fi{grid-template-columns:1fr}.ft .r{text-align:left;justify-self:start}}.fan-t em{font-weight:400}
.fan{display:flex;justify-content:center;justify-content:safe center;align-items:flex-start;padding:95px 36px 60px;overflow-x:auto;width:100%;scrollbar-width:none}.fan::-webkit-scrollbar{display:none}
.cd{position:relative;flex:none;width:clamp(190px, 13vw, 215px);min-height:clamp(310px, 21vw, 360px);border:0;text-align:left;color:var(--tc);border-radius:24px;padding:32px 20px 26px;margin:0 -8px;transform:rotate(var(--r)) translateY(var(--y));transition:transform .55s cubic-bezier(.25,1,.5,1),box-shadow .55s ease;box-shadow:0 16px 32px -12px rgba(30,18,54,.18);cursor:pointer;will-change:transform}.cd:first-child{margin-left:0}.cd:last-child{margin-right:0}
.cd:hover,.cd:focus-visible{transform:rotate(0) translateY(-22px) scale(1.035);z-index:6;box-shadow:0 28px 48px -14px rgba(30,18,54,.3)}
.cd .ct{display:block;font-size:clamp(1.55rem, 1.6vw, 1.85rem);font-weight:800;letter-spacing:-.02em;margin:8px 0 14px}.cd .rl{display:block;border-top:3px solid currentColor;margin-bottom:16px;opacity:.85}
.cd .li{display:block;padding-left:20px;position:relative;font-size:clamp(0.92rem, 0.95vw, 1.02rem);line-height:1.45;margin:0 0 10px;font-weight:500}.cd .li:before{content:"✦";position:absolute;left:0;font-size:.8rem}
.cd .st{position:absolute;top:-36px;right:14px;width:64px;height:64px;transform:rotate(8deg);filter:drop-shadow(0 4px 8px rgba(30,18,54,.12))}
.ill{border-radius:20px;overflow:hidden;background:var(--s);margin-bottom:28px;width:100%;max-width:440px;height:clamp(140px,25vw,175px)}.ill svg{display:block;width:100%;height:100%}.hero{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}.hero>div:first-child{display:flex;flex-direction:column;justify-content:center}.hero .ill{margin:0;display:flex;align-items:center;justify-content:center;background:#E8DAD2;box-shadow:0 20px 48px -16px rgba(30,18,54,.14);border-radius:28px;aspect-ratio:1;max-width:660px;max-height:none;width:100%;height:auto;justify-self:center}.hero .ill svg{width:100%;height:100%;display:block}
@media(max-width:1300px){.fan{justify-content:flex-start;padding-left:36px;padding-right:36px}}
@media(max-width:1000px){.hero{grid-template-columns:1fr;gap:44px}.grid{grid-template-columns:1fr}.feat{grid-template-columns:1fr;gap:20px}}
@media(max-width:760px){.fan{justify-content:flex-start;padding-left:16px;padding-top:75px}.cd{width:185px;min-height:290px}.hero .ill svg{aspect-ratio:1;height:auto;min-height:0}.stp button span{display:none}.nv{padding:8px}.ph{grid-template-columns:110px 1fr 30px}.wrap{padding-top:40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.dash-hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.dash-hdr h2{font-size:clamp(2.4rem,5.5vw,3.6rem)}
.dash-acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn-pdf{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--ln);color:var(--ink);padding:12px 22px;border-radius:999px;font-weight:600;font-size:.95rem;transition:.2s;box-shadow:0 4px 12px rgba(30,18,54,.04)}
.btn-pdf:hover{background:var(--pu2);border-color:var(--pu);color:var(--pu);transform:translateY(-1px)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-bottom:44px}
.kpi{background:#E8DAD2;border-radius:22px;padding:24px 26px;display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:0 10px 24px -10px rgba(30,18,54,.08)}
.kpi .lbl{font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.kpi .val{font-size:clamp(1.5rem,2.1vw,2.1rem);font-weight:800;color:var(--ink);line-height:1.15;margin-bottom:6px}
.kpi .subt{font-size:.9rem;color:var(--mu);line-height:1.45}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:700;width:fit-content}
.badge.ok{background:#E2F2E9;color:#185736}
.badge.warn{background:#FFE3ED;color:#C4136B}
.badge.info{background:#E8F0FE;color:#1A56DB}
.map-ctrls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mtabs{display:inline-flex;background:#fff;border:1.5px solid var(--ln);border-radius:999px;padding:4px;gap:4px}

.map-hint{font-size:.84rem;color:var(--mu)}
.gaps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;margin-top:20px}

.gap-c:hover{border-color:var(--pk2);transform:translateY(-2px);box-shadow:0 12px 24px -10px rgba(30,18,54,.1)}
.gap-c.abs{border-left:5px solid var(--pu)}
.gap-c.int{border-left:5px solid var(--pk2)}
.gap-c.pot{border-left:5px solid #E69D67}
.gap-c.risk{border-left:5px solid #D07A38;background:#FFFBF8}
.gap-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.gap-title{font-size:1.1rem;font-weight:700}
.gap-fn{color:var(--pu);font-size:.86rem;font-weight:600;margin-bottom:8px}
.gap-desc{font-size:.9rem;color:var(--mu);line-height:1.5;margin-bottom:14px}
.gap-act{background:#fff;border-radius:12px;padding:10px 14px;border:1px dashed var(--ln);font-size:.85rem;color:var(--ink);line-height:1.4}
.gap-act b{color:var(--pu)}
.lv-mat{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:20px}
.lv-row{background:#E8DAD2;border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}

.lv-name{font-weight:700;font-size:1.02rem}
.lv-roles{display:flex;gap:6px;flex-wrap:wrap}
.r-dot{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--ln)}
.r-dot.ok{background:#EBF7F0;border-color:#A3D9B5;color:#1B5E3C}

.print-head{display:none}
@media print{
  @page{margin:10mm 12mm;size:A4 portrait}
  body{background:#fff!important;color:#1E1236!important;font-size:10pt!important;line-height:1.4!important}
  header,footer,.dash-acts,.nav,.row,button,.mtabs,.dd,.link,.map-ctrls{display:none!important}
  .wrap{max-width:100%!important;width:100%!important;padding:0!important;margin:0!important}

  .kpis{grid-template-columns:repeat(4,1fr)!important;gap:10px!important;margin-bottom:20px!important}

  .grid{grid-template-columns:1.2fr .8fr!important;gap:18px!important;page-break-inside:avoid}
  .mapc{background:#FAF7F3!important;border:1px solid #E2D7CE!important;padding:10px!important}
  .card{background:#F6F0EA!important;border:1px solid #E2D7CE!important;padding:16px!important;box-shadow:none!important}
  .sec{margin-top:28px!important;page-break-inside:avoid}
  .scroll{overflow:visible!important;border:1px solid #E2D7CE!important}
  table{min-width:100%!important;font-size:9pt!important}
  th{background:#E8DAD2!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{page-break-inside:avoid}
  .gaps-grid{grid-template-columns:repeat(2,1fr)!important;gap:10px!important}
  .gap-c{background:#FAF7F3!important;border:1px solid #E2D7CE!important;page-break-inside:avoid}
  .lv-mat{grid-template-columns:repeat(2,1fr)!important;gap:10px!important;page-break-inside:avoid}
  .lv-row{background:#F6F0EA!important;border:1px solid #E2D7CE!important;padding:12px!important}
}
</style></head><body>
